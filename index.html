<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>♤⚡مۭــمۭــد ۛ ּژئــۏﯣ๛♤°⚡</title>

<style>
body{
    margin:0;
    font-family:tahoma;
    direction:rtl;
    padding:15px;
    overflow-x:hidden;
    background: linear-gradient(270deg, #ff0000, #00ff00, #0000ff, #ff0000);
    background-size: 600% 600%;
    animation: rgbBG 12s ease infinite;
    color:white;
}
@keyframes rgbBG{
    0%{background-position:0% 50%;}
    25%{background-position:50% 50%;}
    50%{background-position:100% 50%;}
    75%{background-position:50% 50%;}
    100%{background-position:0% 50%;}
}

.neon-title{
    text-align:center;
    font-size:32px;
    font-weight:bold;
    color:#38bdf8;
    text-shadow:
        0 0 5px #38bdf8,
        0 0 10px #38bdf8,
        0 0 20px #22c55e,
        0 0 40px #a855f7;
    margin-bottom:10px;
    animation: glow 2s ease-in-out infinite alternate;
}
@keyframes glow{
    from {text-shadow:0 0 5px #38bdf8,0 0 10px #38bdf8,0 0 20px #22c55e,0 0 40px #a855f7;}
    to   {text-shadow:0 0 10px #f59e0b,0 0 20px #f43f5e,0 0 30px #22c55e,0 0 50px #8b5cf6;}
}

.header-line{
    height:4px;
    width:100%;
    background:linear-gradient(90deg,#38bdf8,#22c55e,#a855f7,#f59e0b,#38bdf8);
    background-size:300% 300%;
    animation:gradientMove 6s infinite linear;
    border-radius:10px;
    margin-bottom:20px;
}
@keyframes gradientMove{
    0%{background-position:0% 50%;}
    100%{background-position:100% 50%;}
}

.container{
    max-width:480px;
    margin:auto;
}

h2{
    text-align:center;
    color:#38bdf8;
}

.channel-box{
    text-align:center;
    margin-bottom:20px;
    padding:10px;
    border:2px solid #fbbf24;
    border-radius:10px;
}
.channel-box a{
    color:#fbbf24;
    text-decoration:none;
    font-weight:bold;
}

input,select{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    border-radius:8px;
    border:none;
    background:#1e293b;
    color:white;
}

button{
    position:relative;
    overflow:hidden;
    padding:10px 16px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    margin:4px 2px;
    font-size:14px;
    font-weight:bold;
    color:white;
    transition:0.3s ease, box-shadow 0.3s ease;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.5);
    backdrop-filter: blur(4px);
}
button:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 25px rgba(0,0,0,0.6);
}
button:active{
    transform:scale(0.95);
}

.config-box{
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(6px);
    padding:12px;
    margin-top:15px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,0.5);
}

textarea{
    width:100%;
    height:120px;
    background: rgba(255,255,255,0.05);
    color:#22c55e;
    border:none;
    padding:10px;
    border-radius:8px;
    margin-top:8px;
    font-family:monospace;
}

.log-box{
    background: rgba(0,0,0,0.2);
    color:#22c55e;
    padding:10px;
    margin-top:10px;
    border-radius:10px;
    font-family:monospace;
    font-size:13px;
    height:150px;
    overflow:auto;
}
</style>
</head>

<body>

<div class="neon-title"> ♤مۭــمۭــد ۛ ּژئــۏﯣ๛♤°⚡⚡</div>
<div class="header-line"></div>

<div class="container">

<div class="channel-box">
استاگرام ممدی
<a href="https://instagram.com/en_4c4" target="_blank">@en_4c4</a>
</div>

<h2>تولید کانفیگ جدید</h2>

<input type="text" id="configName" placeholder="اسم کانفیگ را وارد کنید">

<select id="countrySelect">
<option value="de">آلمان</option>
<option value="tr">ترکیه</option>
<option value="ru">روسیه</option>
<option value="ae">امارات</option>
</select>

<select id="dnsSelect"></select>

<input type="number" id="userCountInput" placeholder="تعداد کاربر" min="1" max="10">

<button class="generate" onclick="generateConfig()">ساخت کانفیگ</button>

<div class="log-box" id="liveLog"></div>

<div id="configList"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/tweetnacl/nacl.min.js"></script>

<script>
let configs = JSON.parse(localStorage.getItem("configs")) || [];
let counters = JSON.parse(localStorage.getItem("countryCounters")) || {de:1,tr:1,ru:1,ae:1};

function saveCounters(){
    localStorage.setItem("countryCounters", JSON.stringify(counters));
}

function logMessage(msg){
    const log = document.getElementById("liveLog");
    log.innerHTML += msg + "<br>";
    log.scrollTop = log.scrollHeight;
}

function generateRealWireGuardKeys(){
    const kp = nacl.box.keyPair();
    function toBase64(u8){ return btoa(String.fromCharCode(...u8)); }
    return {
        privateKey: toBase64(kp.secretKey.slice(0,32)),
        publicKey: toBase64(kp.publicKey)
    };
}

const dnsEntries = [
{name:"DNS 1", data:"94.130.180.225, 78.47.64.161"},
{name:"DNS 2", data:"77.88.8.88, 77.88.8.2"},
{name:"DNS 3", data:"8.26.56.26, 8.20.247.20"},
{name:"DNS 4", data:"156.154.70.2, 156.154.71.2"},
{name:"DNS 5", data:"156.154.70.3, 156.154.71.3"},
{name:"DNS 6", data:"1.1.1.1, 1.0.0.1"},
{name:"DNS 7", data:"208.67.222.123, 208.67.220.123"},
{name:"DNS 8", data:"76.76.2.1, 76.76.10.1"},
{name:"DNS 9", data:"76.76.2.4, 76.76.10.4"},
{name:"DNS 10", data:"8.8.8.8, 8.8.4.4"},
{name:"DNS 11", data:"78.157.42.101, 135.181.191.53"}
];

const dnsSelect = document.getElementById("dnsSelect");
dnsEntries.forEach((dns,index)=>{
    let option = document.createElement("option");
    option.value = index;
    option.text = dns.name;
    dnsSelect.add(option);
});

function saveToStorage(){
    localStorage.setItem("configs", JSON.stringify(configs));
}

function generateConfig(){
    document.getElementById("liveLog").innerHTML="";
    let name = document.getElementById("configName").value;
    if(name===""){ alert("نام وارد نشده"); return; }

    let country = document.getElementById("countrySelect").value;
    let counter = counters[country];
    let endpoint = `${country}${counter}.vpnjantit.com:1024`;
    counters[country] = counter>=10?1:counter+1;
    saveCounters();

    let address = `10.8.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}/32`;
    let selectedDNS = dnsEntries[dnsSelect.value].data;
    let userCount = parseInt(document.getElementById("userCountInput").value) || 1;
    let keysArray = [];
    for(let i=0;i<userCount;i++){
        keysArray.push(generateRealWireGuardKeys());
    }

    setTimeout(()=>{
        let configText = `# ${name}\n# Users: ${userCount}\n[Interface]\nAddress = ${address}\nDNS = ${selectedDNS}\nPrivateKey = ${keysArray[0].privateKey}\nListenPort = 55555\nMTU = 1305\n`;
        for(let i=0;i<userCount;i++){
            configText += `[Peer]\nPublicKey = ${keysArray[i].publicKey}\nEndpoint = ${endpoint}\nPersistentKeepalive = 25\n`;
        }

        configs.unshift({name:name, data:configText});  // ✅ فقط این خط تغییر کرده

        saveToStorage();
        renderConfigs();
        logMessage("[✓] Config Created Successfully!");
    }, 600);
}

function deleteConfig(index){
    configs.splice(index,1);
    saveToStorage();
    renderConfigs();
}

function downloadConfig(name,text){
    let blob = new Blob([text], {type:"application/octet-stream"});
    let a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name + ".conf";
    a.click();
}

function renderConfigs(){
    let list = document.getElementById("configList");
    list.innerHTML="";
    configs.forEach((cfg,index)=>{
        list.innerHTML += `
        <div class="config-box">
            <h3>${cfg.name}</h3>
            <button class="download" onclick='downloadConfig("${cfg.name}",\`${cfg.data}\`)'>دانلود</button>
            <button class="delete" onclick='deleteConfig(${index})'>حذف</button>
            <textarea readonly>${cfg.data}</textarea>
        </div>`;
    });
}

renderConfigs();
</script>

</body>
</html>
